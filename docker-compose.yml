services:
  postgres:
    image: postgres:16-alpine
    container_name: talentfinder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talentfinder
      POSTGRES_PASSWORD: talentfinder
      POSTGRES_DB: talentfinder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentfinder -d talentfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: